<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <div class="flex min-h-screen items-center justify-center p-6">
        <div class="w-full max-w-lg rounded-2xl border border-white/10 bg-slate-900/70 p-8 text-center">
            <p class="text-sm uppercase tracking-[0.2em] text-slate-400">404 Error</p>
            <h1 class="mt-3 text-3xl font-bold">Page not found</h1>
            <p class="mt-3 text-slate-300">The page you requested does not exist or was moved.</p>
            <a href="/" class="mt-6 inline-block rounded-lg bg-blue-600 px-5 py-3 font-semibold hover:bg-blue-500">Go Home</a>
        </div>
    </div>
</body>
</html>
